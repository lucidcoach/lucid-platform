<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b11">
  <title>Lucid Community</title>
  <meta name="description" content="Lucid Bot 내전 전적, AI Score, 개인 기록을 확인하는 커뮤니티">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="community-header">
    <div class="header-inner">
      <a class="community-brand" href="./" aria-label="Lucid Community 홈">
        <img src="../assets/logo.jpg" alt="">
        <span><strong>LUCID</strong><small>COMMUNITY</small></span>
      </a>
      <nav class="community-nav" aria-label="커뮤니티 메뉴">
        <button class="nav-tab active" type="button" data-view="recent">최근 내전</button>
        <button class="nav-tab" type="button" disabled title="후속 버전에서 추가">랭킹</button>
      </nav>
      <div class="header-actions">
        <a class="coach-link" href="../">코칭 바로가기</a>
      </div>
    </div>
  </header>

  <main class="community-main">
    <section class="search-strip" aria-label="내전 전적 검색">
      <form id="playerSearchForm" class="player-search">
        <label for="playerSearchInput">닉네임 검색</label>
        <div class="search-control">
          <input id="playerSearchInput" type="search" autocomplete="off" placeholder="내전 닉네임 입력" aria-describedby="searchHint">
          <button type="submit">검색</button>
        </div>
        <span id="searchHint">Lucid Bot에 기록된 내전 닉네임 기준</span>
      </form>
      <button class="clear-search" id="clearSearchBtn" type="button" hidden>최근 내전으로</button>
    </section>

    <section id="statusBanner" class="status-banner" hidden></section>

    <section id="recentView" class="content-view active">
      <div class="section-heading">
        <div>
          <p class="section-kicker">MATCH HISTORY</p>
          <h1>최근 내전</h1>
        </div>
        <button class="ghost-button" id="refreshMatchesBtn" type="button">새로고침</button>
      </div>
      <div id="recentMatches" class="match-feed" aria-live="polite"></div>
      <button class="load-more" id="loadMoreBtn" type="button" hidden>더 보기</button>
    </section>

    <section id="searchView" class="content-view">
      <div id="searchResults"></div>
    </section>
  </main>

  <template id="loadingTemplate">
    <div class="loading-card"><span></span><span></span><span></span></div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
