<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucid 내전 기록</title>
  <script>
    fetch("../index.html").then(response => {
      if (!response.ok) throw new Error("내전 기록 화면을 불러오지 못했습니다.");
      return response.text();
    }).then(markup => {
      markup = markup.replace(/<script type="module" src="js\/app-report6\.js[^>]*><\/script>/, "");
      document.open();
      document.write(markup);
      document.close();
      return import("../js/app-report6.js?v=20260915community2");
    }).catch(() => {
      document.body.innerHTML = '<p><a href="../?view=recent">내전 기록으로 이동</a></p>';
    });
  </script>
</head>
<body><noscript><a href="../?view=recent">내전 기록으로 이동</a></noscript></body>
</html>
