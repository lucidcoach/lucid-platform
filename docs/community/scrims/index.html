<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucid 내전 기록</title>
  <script>
    const target = new URL("../", location.href);
    target.search = location.search;
    if (!target.searchParams.has("view") && !target.searchParams.has("player") && !target.searchParams.has("q")) target.searchParams.set("view", "recent");
    target.hash = location.hash;
    location.replace(target);
  </script>
</head>
<body><noscript><a href="../?view=recent">내전 기록으로 이동</a></noscript></body>
</html>
